name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it?
      description: Steps, the view (2D / 3D / costs / print), and if possible the house.json (or a small one that shows the problem).
  - type: input
    id: env
    attributes:
      label: Browser and operating system
