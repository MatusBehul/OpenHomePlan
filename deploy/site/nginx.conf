# Static public page. No cookies; access logs without visitors' IP addresses.
log_format noip '$time_iso8601 $request_method $uri $status';
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout noip;
  server_tokens off;

  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ =404;
  }
  location /img/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=604800";
  }
  location = /style.css {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
  }
}
